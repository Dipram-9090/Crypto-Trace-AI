# CryptoTrace AI Configuration

project:
  name: "CryptoTrace AI"
  version: "1.0.0"
  description: "Offline-capable Multi-Modal Graph & ML Forensic Analytics for Suspicious Bitcoin Transactions"
  seed: 42

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  synthetic_data_dir: "data/synthetic"
  models_dir: "models"
  reports_dir: "reports"
  geoip_db_path: "data/external/GeoLite2-City.mmdb"
  geoip_asn_path: "data/external/GeoLite2-ASN.mmdb"

data_generation:
  num_transactions: 12000
  num_wallets: 1200
  num_ips: 150
  num_asns: 25
  time_steps: 50
  illicit_ratio: 0.08
  seed: 42

ingestion:
  strict_validation: false
  supported_formats: ["csv", "json", "xml"]
  date_format: "%Y-%m-%d %H:%M:%S"

features:
  velocity_windows_hours: [1, 6, 24, 168]
  graph_max_hops: 3
  temporal_burst_threshold_seconds: 60

models:
  temporal_split:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
  
  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
    scale_pos_weight: 10.0
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    eval_metric: "aucpr"
    
  isolation_forest:
    n_estimators: 150
    contamination: 0.08
    random_state: 42
    
  graphsage:
    in_channels: 16
    hidden_channels: 64
    out_channels: 2
    num_layers: 2
    dropout: 0.2
    learning_rate: 0.005
    epochs: 40
    batch_size: 128

risk_scoring:
  weights:
    ml_score: 0.50
    anomaly_score: 0.20
    graph_score: 0.20
    behavioral_score: 0.10
  
  thresholds:
    low: [0, 30]
    medium: [30, 60]
    high: [60, 80]
    critical: [80, 100]

explainability:
  top_k_features: 6
  shap_sample_size: 500

dashboard:
  theme: "dark"
  default_page: "Overview"
  max_graph_nodes_display: 120

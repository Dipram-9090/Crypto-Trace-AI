name: Lint & Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff Lint Check
        run: |
          ruff check . --ignore E501,F401,E402,F841,E722,I001,E701,W291,W293,F821,F541,W292,E741,B008,B006 --exclude node_modules,.venv,frontend || true

      - name: Check Formatting with Black
        run: |
          black --check src/ tests/ blockchain/ ai_ml/ backend/ || black --check src/ tests/ || true

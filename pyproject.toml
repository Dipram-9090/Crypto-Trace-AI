[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptotrace"
version = "1.0.0"
description = "Enterprise Multi-Modal Graph & ML Forensic Analytics for Bitcoin Transactions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "CryptoTrace AI Engineering Team", email = "rajdeep@example.com" }
]
keywords = ["bitcoin", "forensics", "machine-learning", "graph-neural-networks", "xgboost", "shap", "blockchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography"
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "polars>=0.20.0",
    "pyarrow>=14.0.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "shap>=0.44.0",
    "joblib>=1.3.0",
    "torch>=2.0.0",
    "networkx>=3.1",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "pyvis>=0.3.2",
    "altair>=5.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
python_files = ["test_*.py"]
addopts = "-p no:anyio"
norecursedirs = [".git", "data", "models", "reports", "notebooks", "src", "docs", "configs", "dashboard"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

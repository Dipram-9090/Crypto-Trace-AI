# Blockchain Providers & Node RPC Configurations
chains:
  ethereum:
    rpc_url: "https://eth.llamarpc.com"
    chain_id: 1
    native_currency: "ETH"
    block_time_seconds: 12
    explorer_url: "https://etherscan.io"
  bitcoin:
    rpc_url: "http://127.0.0.1:8332"
    chain_id: 0
    native_currency: "BTC"
    block_time_seconds: 600
    explorer_url: "https://mempool.space"
  polygon:
    rpc_url: "https://polygon-rpc.com"
    chain_id: 137
    native_currency: "POL"
    explorer_url: "https://polygonscan.com"
  bsc:
    rpc_url: "https://binance.llamarpc.com"
    chain_id: 56
    native_currency: "BNB"
    explorer_url: "https://bscscan.com"
  solana:
    rpc_url: "https://api.mainnet-beta.solana.com"
    chain_id: 101
    native_currency: "SOL"
    explorer_url: "https://solscan.io"

mempool_watcher:
  poll_interval_seconds: 3.0
  max_pending_buffer: 5000

sanctions:
  enabled: true
  sources:
    - "OFAC_SDN"
    - "UN_SANCTIONS"
    - "EU_RESTRICTIVE_MEASURES"

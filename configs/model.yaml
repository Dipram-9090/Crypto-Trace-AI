# Model hyperparameters and training configuration

temporal_split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

xgboost:
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.05
  scale_pos_weight: 10.0
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  eval_metric: "aucpr"

isolation_forest:
  n_estimators: 150
  contamination: 0.08
  random_state: 42

graphsage:
  in_channels: 46
  hidden_channels: 64
  out_channels: 2
  num_layers: 2
  dropout: 0.2
  learning_rate: 0.005
  epochs: 30
  batch_size: 128

baselines:
  logistic_regression:
    max_iter: 1000
    class_weight: "balanced"
    random_state: 42
  random_forest:
    n_estimators: 100
    max_depth: 8
    class_weight: "balanced"
    random_state: 42
